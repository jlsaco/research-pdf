# =============================================================================
# Deep-Research for Technical Slide PDFs — Configuration
# =============================================================================
# This file is meant to be edited by you. It controls how the /deep-research
# system behaves: default parameters, how many fix iterations the reviewer may
# run, research source rules, the section schema, the curated trusted-source
# list, and suggested roles.
#
# Param resolution order (always):
#   1. Explicit prompt args / flags  (e.g. --role "AI Engineer" --depth deep)
#   2. The `defaults:` block below
#   3. Interactive AskUserQuestion   (ONLY if the run is interactive AND a value
#      is still missing). Non-interactive `claude -p` runs never block on input.
# =============================================================================

# -----------------------------------------------------------------------------
# Default parameters used when a value is not passed explicitly.
# role:     free text — who the deliverable is written for.
# language: output language. Allowed: es | en
# depth:    how thorough. Allowed: quick | standard | deep
# -----------------------------------------------------------------------------
defaults:
  role: "Project Manager"
  language: "en"
  depth: "standard"

# Maximum number of reviewer fix loops before stopping (good-enough cap).
# The research-reviewer may request fixes; after this many iterations the run
# stops and documents any remaining gaps instead of looping forever.
max_iterations: 3

# -----------------------------------------------------------------------------
# Research behavior
# -----------------------------------------------------------------------------
research:
  # Always SEARCH the web in this language for best source quality, even when
  # the OUTPUT language differs. Output language is controlled by `language`.
  prefer_language: "en"

  # Minimum number of general / introductory sources per topic.
  min_general_sources: 1

  # Number of specific (authoritative, on-topic) sources required per topic,
  # keyed by depth.
  specific_sources_by_depth:
    quick: 1
    standard: 3
    deep: 5

  # If true, every cited link must be fetched and verified live before it is
  # allowed into the output. Broken links are dropped or replaced.
  verify_links: true

# -----------------------------------------------------------------------------
# Section schema
# -----------------------------------------------------------------------------
# Drives what md-author writes. Fixed sections always appear; optional sections
# are included based on the depth mapping below (and <role> is substituted into
# role-specific section titles).
# -----------------------------------------------------------------------------
sections:
  topic:
    fixed:
      - "Summary"
      - "Prerequisite concepts"
      - "Deep dive"
      - "Sources"
      - "References"
    optional:
      - "Why it matters for <role>"
      - "Hands-on"
      - "Common pitfalls"
      - "Going deeper"
      - "Glossary"
      - "Related slides & topics"

  slide:
    fixed:
      - "What this slide says"
      - "Key concepts"
      - "Linked topics"
    optional:
      - "Notes for <role>"

  # depth -> which optional sections to include (in addition to all fixed ones).
  # quick:    fixed only.
  # standard: fixed + "Why it matters for <role>" + "Common pitfalls".
  # deep:     fixed + ALL optional sections.
  depth_mapping:
    quick:
      topic_optional: []
      slide_optional: []
    standard:
      topic_optional:
        - "Why it matters for <role>"
        - "Common pitfalls"
      slide_optional:
        - "Notes for <role>"
    deep:
      topic_optional:
        - "Why it matters for <role>"
        - "Hands-on"
        - "Common pitfalls"
        - "Going deeper"
        - "Glossary"
        - "Related slides & topics"
      slide_optional:
        - "Notes for <role>"

# -----------------------------------------------------------------------------
# Trusted sources
# -----------------------------------------------------------------------------
# The web-researcher prefers these domains. High-priority sources are tried
# first; medium-priority are good secondary references. Wikipedia is a general
# fallback for introductory / definitional context.
#
# Feel free to ADD or REMOVE entries. Each entry:
#   name:     human-readable label
#   url:      base URL / docs root
#   tags:     topics this source is good for (used for matching)
#   priority: high | medium
# -----------------------------------------------------------------------------
trusted_sources:
  - name: "Anthropic Docs"
    url: "https://docs.anthropic.com"
    tags: ["ai", "llm", "claude", "agents", "prompting", "api"]
    priority: high

  - name: "Claude Docs"
    url: "https://docs.claude.com"
    tags: ["ai", "llm", "claude", "agents", "prompting", "api"]
    priority: high

  - name: "OpenAI Platform Docs"
    url: "https://platform.openai.com/docs"
    tags: ["ai", "llm", "openai", "gpt", "api", "agents"]
    priority: high

  - name: "OpenAI Developers (Codex)"
    url: "https://developers.openai.com"
    tags: ["ai", "llm", "openai", "codex", "code-generation", "api"]
    priority: high

  - name: "Model Context Protocol (MCP)"
    url: "https://modelcontextprotocol.io"
    tags: ["mcp", "agents", "tools", "integration", "ai"]
    priority: high

  - name: "Zapier"
    url: "https://zapier.com"
    tags: ["automation", "no-code", "integration", "workflows"]
    priority: medium

  - name: "Zapier Help Center"
    url: "https://help.zapier.com"
    tags: ["automation", "no-code", "integration", "workflows", "how-to"]
    priority: medium

  - name: "Make (Integromat)"
    url: "https://www.make.com"
    tags: ["automation", "no-code", "integration", "workflows"]
    priority: medium

  - name: "Make Help Center"
    url: "https://help.make.com"
    tags: ["automation", "no-code", "integration", "workflows", "how-to"]
    priority: medium

  - name: "Google AI / Gemini"
    url: "https://ai.google.dev"
    tags: ["ai", "llm", "gemini", "google", "api"]
    priority: high

  - name: "MDN Web Docs"
    url: "https://developer.mozilla.org"
    tags: ["web", "apis", "javascript", "http", "browser", "standards"]
    priority: high

  - name: "n8n Docs"
    url: "https://docs.n8n.io"
    tags: ["automation", "workflows", "integration", "self-hosted"]
    priority: medium

  - name: "LangChain (Python)"
    url: "https://python.langchain.com"
    tags: ["ai", "llm", "agents", "framework", "orchestration", "rag"]
    priority: medium

  - name: "Wikipedia"
    url: "https://en.wikipedia.org"
    tags: ["general", "definitions", "background", "fallback"]
    priority: medium

# -----------------------------------------------------------------------------
# Suggested roles
# -----------------------------------------------------------------------------
# These are SUGGESTIONS only — `role` is free text, so any value is accepted.
# The focus note hints at what the deliverable should emphasize for that role.
# -----------------------------------------------------------------------------
roles:
  - name: "Project Manager"
    focus: "Outcomes, trade-offs, timelines, and risk over implementation detail."
  - name: "AI Engineer"
    focus: "Architecture, model behavior, prompting, evaluation, and integration."
  - name: "Software Developer"
    focus: "APIs, code-level usage, patterns, and concrete how-to."
  - name: "Executive / Decision-maker"
    focus: "Strategic impact, cost/benefit, and the bottom line in plain terms."
  - name: "Student"
    focus: "Foundations, definitions, and step-by-step explanations from first principles."
